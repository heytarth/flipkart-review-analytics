<script>
const STAGES = [
  {
    nav: 'Problem',
    eyebrow: 'Stage 0 &#8212; Problem definition',
    title: 'What question is this project answering?',
    lede: 'Star ratings compress every review into one number. That hides why customers are unhappy, and treats a one-word "Good" as equal to a detailed account of a fault.',
    blocks: [
      { h: 'The problem', p: [
        'This dataset holds 189,874 reviews across 812 products. No one can read them, so decisions get made from the average rating alone &#8212; which says nothing about <em>what went wrong</em>, and counts every review as equally informative.',
        'The project answers three questions: can sentiment be predicted from the text, what themes do customers actually write about, and how much of the corpus carries no information at all.'
      ]},
      { h: 'Analytical questions', table: {
        head: ['', 'Question', 'Answered by'],
        rows: [
          ['AQ1', 'How accurately can sentiment be predicted, and which algorithm is best?', 'Component 1'],
          ['AQ2', 'What themes dominate, and do any carry disproportionate negativity?', 'Component 2'],
          ['AQ3', 'What share of reviews are low-information, and can that be identified reliably?', 'Component 3']
        ]}},
      { h: 'Pipeline', figure: ['figures/pipeline_architecture.png',
        'The implemented pipeline. The three analytical components run in parallel off a shared feature stage; the external validation of Component 3 is the element that goes beyond a standard three-component project. Those labels are LLM-generated, not human annotation.'] }
    ]
  },
  {
    nav: 'Data',
    eyebrow: 'Stage 1 &#8212; Data collection',
    title: 'A public dataset, after live scraping was abandoned',
    lede: 'Scraping Flipkart directly was attempted and dropped for a documented reason. The fallback is an approved public dataset, which the course guidelines permit.',
    blocks: [
      { h: 'What happens', p: [
        'The raw CSV is loaded with <code>encoding=\'latin1\'</code> &#8212; it contains non-UTF8 bytes from the original scrape that appear as mojibake in currency symbols and emoji. Reading it as UTF-8 fails outright.'
      ]},
      { h: 'Why not scrape live', p: [
        'Amazon.in blocked automated access with CAPTCHA. Flipkart\'s internal API gateway returned <code>HTTP 403</code> with an <code>x-bifrost-error</code> header to any non-browser client, even carrying a valid session cookie. Working around that needed a headful browser automation stack, which was judged too fragile for the deadline.',
        'Using a public dataset removes the platform-terms risk entirely. Only review text, ratings, product names and prices are used &#8212; no personal identifiers.'
      ]},
      { h: 'Result', tiles: [
        ['189,874', 'raw reviews'], ['812', 'unique products'], ['5', 'columns per review'], ['78%', 'rated 4 or 5 stars']
      ]},
      { h: 'The five columns', table: {
        head: ['Column', 'Type', 'What it holds', 'Used for'],
        rows: [
          ['<code>ProductName</code>', 'text', 'Full product title, e.g. "Candes 12 L Room/Personal Air Cooler"', 'Grouping reviews by product'],
          ['<code>Price</code>', 'text', 'Price as displayed, with currency symbol and commas', 'Cleaned to an integer; not used in the models'],
          ['<code>Rate</code>', 'integer', 'The customer\'s star rating &#8212; a whole number from 1 (worst) to 5 (best)', 'Source of the sentiment label, and a clustering feature'],
          ['<code>Review</code>', 'text', 'The short headline the customer gave, e.g. "Super!"', 'Not used &#8212; too short to carry signal'],
          ['<code>Summary</code>', 'text', 'The body of the review. <strong>This is the main text field.</strong>', 'Sentiment classification, topic discovery, length and repetition features']
        ]}},
      { h: 'How ratings become sentiment labels', p: [
        'There is no human-annotated sentiment in this dataset, so the label is derived from the star rating: <strong>4 or 5 stars &#8594; positive</strong>, <strong>3 stars &#8594; neutral</strong>, <strong>1 or 2 stars &#8594; negative</strong>. This is the standard mapping in review-analytics work.',
        'It carries a consequence that runs through the whole project: the classifiers are learning to predict the <em>star rating</em> from the text, not human-judged sentiment. Where the two disagree &#8212; a review reading "very good" that carries 3 stars &#8212; the model is marked wrong for agreeing with the words. That is a limitation of the labels, not of the model.'
      ]}
    ]
  },
  {
    nav: 'Preprocess',
    eyebrow: 'Stage 2 &#8212; Preprocessing',
    title: 'Seven steps, each removing an identified defect',
    lede: 'Every step exists because something specific was wrong with the data. Row counts are recorded after each so the effect is auditable.',
    blocks: [
      { h: 'What happens', table: {
        head: ['Step', 'Defect addressed', 'Rows dropped'],
        rows: [
          ['1', 'Non-numeric ratings &#8212; product text leaked into the column via unescaped commas', '5'],
          ['2', 'Missing review text &#8212; nothing to analyse', '13'],
          ['3', 'Mojibake from the encoding corruption', '&#8212;'],
          ['4', 'Price stored as text (<code class="mono">??3,999</code> &#8594; <code class="mono">3999</code>)', '&#8212;'],
          ['5', 'Record text repetition <em>before</em> removing it', '&#8212;'],
          ['6', 'Exact duplicate reviews &#8212; scraping artefacts', '57,446'],
          ['7', 'Derive sentiment label and word count', '&#8212;']
        ]}},
      { h: 'Why step 5 comes before step 6', p: [
        'This ordering was a real bug. Step 6 deletes duplicate reviews. The original code counted repetition <em>after</em> that deletion, so the count came back as 1 for almost every row &#8212; the feature was constant and contributed nothing, silently reducing Component 3 to two working features.',
        'Counting first, and across all products rather than within one, is what makes the feature carry signal at all.'
      ]},
      { h: 'Result', tiles: [
        ['132,410', 'cleaned rows'], ['56.8%', 'share text with another review'], ['15,818', 'copies of the word "Good"'], ['5', 'median words per review']
      ]},
      { h: '', note: 'The most common review text in the dataset is the single word <strong>&#8220;Good&#8221;</strong>, appearing 15,818 times. That single fact drives the whole of Component 3.' }
    ]
  },
  {
    nav: 'Features',
    eyebrow: 'Stage 3 &#8212; Feature representation',
    title: 'Three representations, because three tasks need different things',
    lede: 'Using one representation everywhere would be wrong. Each component needs a different view of the same reviews.',
    blocks: [
      { h: 'What happens', table: {
        head: ['Component', 'Representation', 'Why this one'],
        rows: [
          ['Classification', 'TF-IDF, 1&#8211;2 grams, 5,000 features', 'Down-weights words appearing in every review; bigrams keep "not good" intact'],
          ['Topic discovery', 'Raw counts, 2,000 features', 'LDA is a generative model over counts &#8212; TF-IDF weights break its assumption'],
          ['Review quality', 'Behavioural, 4 features', 'Length, punctuation, repetition and rating &#8212; not the words themselves']
        ]}},
      { h: 'Why not stem or lemmatise', p: [
        'Both were considered and skipped. The median review is 5 words long, and TF-IDF with bigrams over a 5,000-term vocabulary already collapses most inflection that matters at this scale. Stemming would mainly have merged distinct product terms.'
      ]}
    ]
  },
  {
    nav: 'Sentiment',
    eyebrow: 'Stage 4 &#8212; Component 1',
    title: 'Sentiment classification: four models disagree',
    lede: 'Four classifiers on an identical stratified 80/20 split. Two different models win, depending on which metric you believe.',
    blocks: [
      { h: 'Result', table: {
        head: ['Model', 'Accuracy', 'Weighted F1', 'Macro F1', 'Neutral F1'],
        rows: [
          ['Naive Bayes', '0.8474', '<strong>0.8222</strong>', '0.6100', '0.1758'],
          ['Decision Tree', '0.7249', '0.7470', '0.5732', '0.2571'],
          ['Logistic Regression', '0.7745', '0.8002', '<strong>0.6394</strong>', '<strong>0.3137</strong>'],
          ['Complement NB', '0.8142', '0.8163', '0.6374', '0.2969']
        ], best: [0, 2], nums: [1, 2, 3, 4] }},
      { h: 'Why they disagree', p: [
        'Weighted F1 is dominated by the positive class, which is 73% of the test set. A model can score well on it while effectively ignoring the neutral class &#8212; and Naive Bayes does exactly that, predicting "neutral" just <strong>535 times out of 24,406</strong>.',
        'Macro F1 weights all three classes equally and exposes this. Logistic Regression predicts neutral 4,227 times and recovers 979 of the 2,014 true neutrals, nearly doubling neutral F1.',
        'So the model choice has to name its objective. Best overall performance on the real class distribution &#8594; Naive Bayes. Balanced performance across all three classes &#8594; Logistic Regression.'
      ]},
      { h: 'Error analysis', p: [
        'The two models fail in <em>opposite directions</em>. 73% of Naive Bayes errors are something &#8594; positive. 45% of Logistic Regression errors are positive &#8594; neutral.',
        'Error rate is flat across review length (14.2% for 1&#8211;2 words, 15.6% for 20+), so short text is not the problem. The problem is the labels: a review reading <em>&#8220;very good&#8221;</em> carries a 3-star rating, and <em>&#8220;it\'s good one&#8221;</em> likewise. The text is positive; the derived label says neutral.'
      ]},
      { h: '', figure: ['figures/confusion_matrices.png',
        'All four confusion matrices. The near-empty neutral column for Naive Bayes (top left) is the whole argument in one picture.'] }
    ]
  },
  {
    nav: 'Topics',
    eyebrow: 'Stage 5 &#8212; Component 2',
    title: 'Topic discovery: service complaints, not product faults',
    lede: 'LDA over 84,070 reviews of at least four words. Six topics, labelled by the terms that actually distinguish them.',
    blocks: [
      { h: 'What happens', p: [
        'LDA infers topics from word co-occurrence, with no labels and no pre-defined categories. Each review is then assigned its most probable topic.',
        'Labelling topics by their <em>most probable</em> words fails here: "product", "good" and "quality" sit near the top of all six. Ranking instead by how much more probable a term is in one topic than across topics on average gives labels the evidence actually supports.'
      ]},
      { h: 'Result', table: {
        head: ['Topic', 'Distinctive terms', 'Reviews', 'Negative'],
        rows: [
          ['0', 'like, super, poor, machine, bought, properly, colour', '7,008', '27.8%'],
          ['1', 'use, tv, small, easy, perfect, day, works', '13,920', '21.0%'],
          ['2', 'worth, using, range, amazing, performance, overall', '8,904', '17.5%'],
          ['3', '<strong>bad, don, installation, worst, waste, expected</strong>', '15,175', '<strong>46.4%</strong>'],
          ['4', 'nice, happy, value, thanks, love, superb', '27,290', '4.1%'],
          ['5', 'price, best, service, satisfied, low, bass', '11,773', '11.5%']
        ], best: [3], nums: [2, 3] }},
      { h: 'The finding', p: [
        'Topic 3 carries more than ten times the negativity of topic 4, and its distinctive vocabulary is <em>service and expectation</em> language &#8212; installation, waste, worst, expected &#8212; rather than product-feature language.',
        'That points at delivery and installation as the driver of dissatisfaction, which is actionable in a way an overall star average is not.'
      ]},
      { h: 'Is it an artefact?', p: [
        'Assigning each review to one topic discards the soft mixture LDA actually infers. Re-weighting sentiment by the full distribution instead gives the <strong>same</strong> most-negative topic (3), at 35.9%. The finding survives the simplification &#8212; a check that could have failed.'
      ]},
      { h: '', figure: ['figures/topic_distribution.png',
        'Topic sizes and negativity. The largest topic is generic gratitude; the most negative is service-related.'] },
      { h: '', figure: ['figures/topic_wordclouds.png',
        'Word clouds of the six topics, sized by term probability within each topic. These show the most probable terms &#8212; useful for a quick read, but note that the generic words appearing across several clouds are exactly why the distinctive-term ranking above was needed.'] },
      { h: 'Why six topics', p: [
        'A UMass coherence sweep over k = 3&#8230;10 favours <strong>k=4</strong> (&#8722;2.81) over k=6 (&#8722;3.11). k=6 was kept anyway: at k=4 two of the four topics are near-duplicate generic-praise themes, so the better score buys no insight, and UMass coherence is known to favour fewer, broader topics because it rewards co-occurrence among high-frequency terms.',
        'The sweep disagreeing with the choice is reported rather than hidden.'
      ]},
      { h: '', figure: ['figures/topic_coherence.png',
        'Coherence by k. Green marks the best score; orange marks the value retained, against the metric\'s preference.'] }
    ]
  },
  {
    nav: 'Quality',
    eyebrow: 'Stage 6 &#8212; Component 3',
    title: 'Finding reviews that say nothing',
    lede: 'K-Means on behavioural features &#8212; how long a review is, how often its exact text repeats across the catalogue, and what it rated.',
    blocks: [
      { h: 'What happens', p: [
        'Four features, standardised: word count, exclamation ratio, log repetition frequency, and star rating. Repetition is log-transformed because raw frequency spans 1 to 15,818 with a median of 1 &#8212; on that scale it would dominate the distance metric and nothing else would matter.',
        'K is chosen by silhouette among <em>non-degenerate</em> solutions: any partition where a cluster holds under 1% of the data is rejected. K=5 scored marginally higher (0.5364) by isolating 191 rows, which describes too few reviews to interpret.'
      ]},
      { h: 'Result', table: {
        head: ['Cluster', 'Reviews', 'Share', 'Words', 'Avg repeats', 'Rating', 'Reading'],
        rows: [
          ['0', '19,620', '<strong>14.8%</strong>', '1.8', '<strong>2,349&#215;</strong>', '4.50', 'Low-information'],
          ['1', '74,460', '56.2%', '7.9', '2.9&#215;', '4.75', 'Ordinary positive'],
          ['2', '8,196', '6.2%', '56.0', '1.2&#215;', '4.08', 'Long and detailed'],
          ['3', '30,134', '22.8%', '8.4', '18.5&#215;', '1.73', 'Genuine complaints']
        ], best: [0], nums: [1, 2, 3, 4, 5] }},
      { h: 'What this is not', note: 'This is <strong>not fake-review detection</strong>. The dataset has no ground truth for authenticity, so no such claim could be evaluated. The finding is that 14.8% of reviews are one-word text repeated thousands of times across the catalogue &#8212; low information content, which is a different and defensible claim.' },
      { h: '', figure: ['figures/clustering_analysis.png',
        'K selection, cluster sizes, structure, and sentiment composition. Note that the sentiment panel is partly circular &#8212; rating is itself a clustering feature.'] }
    ]
  },
  {
    nav: 'Validation',
    eyebrow: 'Stage 7 &#8212; Validation',
    title: 'Does an independent reader agree with the algorithm?',
    lede: 'Silhouette says the clusters are well separated. It says nothing about whether the flagged cluster contains what we claim. Testing that needs a judgement made by reading the text.',
    blocks: [
      { h: 'Protocol', p: [
        '200 reviews &#8212; 100 flagged, 100 not &#8212; exported shuffled with the cluster IDs hidden in a separate key file, then labelled against a criterion (<em>does the text convey any product-specific or experience-specific detail?</em>) that was written down <strong>before</strong> labelling began.',
        'A refinement made during labelling &#8212; that naming the product category counts as informative &#8212; is disclosed rather than absorbed silently.'
      ]},
      { h: 'Who produced the labels', note: '<strong>The labels were generated by an LLM (Claude) applying the written criterion, not by a human annotator.</strong> This is external validation, not human validation. It is still informative, because K-Means never reads the words &#8212; it uses length, repetition and rating &#8212; while the labeller read only the text, so the two signals are different. But an LLM\'s sense of &#8220;low-information&#8221; plausibly tracks brevity, which is also most of what the clustering keys on, and that shared bias would inflate agreement. Read 0.980 with that in mind.'
      },
      { h: 'Result', tiles: [
        ['0.980', 'Precision', true], ['0.737', 'Recall'], ['0.841', 'F1'], ['0', 'labels checked by a human']

const stepsEl = document.getElementById('steps');
const panelEl = document.getElementById('panel');
let current = 0;

function esc(s) { return s; }

function renderBlock(b) {
  let out = '<div class="block">';
  if (b.h) out += `<h3>${b.h}</h3>`;
  if (b.p) out += b.p.map(t => `<p>${t}</p>`).join('');
  if (b.note) out += `<div class="note">${b.note}</div>`;
  if (b.tiles) {
    out += '<div class="tiles">' + b.tiles.map(t =>
      `<div class="tile${t[2] ? ' hl' : ''}"><div class="v">${t[0]}</div><div class="k">${t[1]}</div></div>`
    ).join('') + '</div>';
  }
  if (b.table) {
    const t = b.table;
    const nums = new Set(t.nums || []);
    const best = new Set(t.best || []);
    out += '<div class="scroll"><table><thead><tr>' +
      t.head.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
      t.rows.map((r, i) => `<tr class="${best.has(i) ? 'best' : ''}">` +
        r.map((c, j) => `<td class="${nums.has(j) ? 'num' : ''}">${c}</td>`).join('') +
        '</tr>').join('') + '</tbody></table></div>';
  }
  if (b.figure) {
    out += `<figure><img src="${b.figure[0]}" alt="${b.figure[1].replace(/<[^>]*>/g, '')}" loading="lazy">` +
           `<figcaption>${b.figure[1]}</figcaption></figure>`;
  }
  return out + '</div>';
}

function render() {
  const s = STAGES[current];
  panelEl.innerHTML =
    `<div class="eyebrow">${s.eyebrow}</div>` +
    `<h2>${s.title}</h2>` +
    `<p class="lede">${s.lede}</p>` +
    s.blocks.map(renderBlock).join('') +
    `<div class="nav">
       <button id="prev" ${current === 0 ? 'disabled' : ''}>&larr; Back</button>
       <button id="next" class="primary" ${current === STAGES.length - 1 ? 'disabled' : ''}>Next stage &rarr;</button>
       <span class="counter">${String(current + 1).padStart(2, '0')} / ${String(STAGES.length).padStart(2, '0')}</span>
     </div>`;

  document.getElementById('prev').onclick = () => go(current - 1);
  document.getElementById('next').onclick = () => go(current + 1);

  [...stepsEl.querySelectorAll('button')].forEach((b, i) => {
    b.setAttribute('aria-current', i === current ? 'true' : 'false');
    b.classList.toggle('done', i < current);
  });
}

function go(i) {
  if (i < 0 || i >= STAGES.length) return;
  current = i;
  render();
  panelEl.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  try { localStorage.setItem('cbs3009-stage', String(i)); } catch (e) {}
}

stepsEl.innerHTML = STAGES.map((s, i) =>
  `<li><button type="button"><span class="n">${String(i).padStart(2, '0')}</span><span class="label">${s.nav}</span></button></li>`
).join('');
[...stepsEl.querySelectorAll('button')].forEach((b, i) => { b.onclick = () => go(i); });

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(current + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(current - 1); }
});

try {
  const saved = parseInt(localStorage.getItem('cbs3009-stage'), 10);
  if (!isNaN(saved) && saved >= 0 && saved < STAGES.length) current = saved;
} catch (e) {}

render();
</script>
